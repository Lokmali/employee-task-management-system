# GitHub Actions CI: runs on every push and pull request.
# Two jobs in parallel: backend tests (Java 17) and frontend build (Node 20).

name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          # Caches ~/.m2 so Maven dependencies download faster next time.
          cache: maven

      - name: Run Maven tests
        # mvnw downloads Maven if needed — no global Maven install required.
        run: chmod +x mvnw && ./mvnw -B test

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          # Caches npm packages using package-lock.json.
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        # Dummy API URL is enough for CI — we only check that the build succeeds.
        env:
          VITE_API_URL: http://localhost:8080
        run: npm run build
