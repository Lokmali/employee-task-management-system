# application.yml — Spring Boot reads this on startup.
# ${VAR:default} means: use environment variable VAR if set, otherwise use default.

server:
  port: 8080

spring:
  application:
    name: employee-task-management

  datasource:
    # JDBC URL points at the Docker Postgres from docker-compose.yml
    url: ${DB_URL:jdbc:postgresql://localhost:5433/etms}
    username: ${DB_USERNAME:etms}
    password: ${DB_PASSWORD:etms}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # update = create missing tables / columns automatically (good for learning).
      # Later we will switch to validate + Flyway/Liquibase migrations.
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

# Swagger UI: http://localhost:8080/swagger-ui.html
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
