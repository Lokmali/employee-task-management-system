# application.yml — Spring Boot reads this on startup.
# ${VAR:default} means: use environment variable VAR if set, otherwise use default.
# Never put real production secrets in this file — override with env vars / .env.

server:
  port: 8080

spring:
  application:
    name: employee-task-management

  datasource:
    # Local default uses host port 5433 (docker-compose maps Postgres there).
    # Inside docker-compose the backend uses jdbc:postgresql://postgres:5432/etms.
    url: ${DB_URL:jdbc:postgresql://localhost:5433/etms}
    username: ${DB_USERNAME:etms}
    password: ${DB_PASSWORD:etms}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # update = create missing tables / columns automatically (good for learning).
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

app:
  jwt:
    # Must be long enough for HS256 (at least 32 characters / 256 bits).
    secret: ${JWT_SECRET:LocalDevOnly-ChangeMe-EmployeeTaskMgmt-HS256-Secret-Key-32chars+}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    # Comma-separated browser origins allowed to call the API.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Actuator: only health is exposed (nothing else like env/beans).
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

# Swagger UI: http://localhost:8080/swagger-ui.html
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
