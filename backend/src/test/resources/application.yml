# Test profile config. Maven picks this up from src/test/resources and it
# overrides the main application.yml while tests run.
# We use H2 so tests do not need Docker or a real PostgreSQL.

spring:
  datasource:
    url: jdbc:h2:mem:etms_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    open-in-view: false

app:
  jwt:
    secret: TestOnly-ChangeMe-EmployeeTaskMgmt-HS256-Secret-Key-32chars+
    expiration-ms: 3600000
  cors:
    allowed-origins: http://localhost:5173
