server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip makes JS/CSS smaller over the network.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json;

    # React Router (BrowserRouter) needs this:
    # unknown paths like /employees must fall back to index.html so React can route.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache hashed Vite assets aggressively; index.html should stay fresh.
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
